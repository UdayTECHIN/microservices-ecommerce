services:
  user-service:
   image: user-service:v2
   networks:
    - microservices-net
    
  order-service:
    image: order-service:v7
    
  
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - microservices-net

  postgres:
    image: postgres:16
    container_name: postgres-compose
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5      

  api-gateway:
    image: api-gateway:v5
    container_name: api-gateway-compose
    ports:
      - "3000:3000"
    networks:
      - microservices-net


networks:
  microservices-net:
    driver: bridge

volumes:
  postgres-data:

